<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>

<div class="calculadora_data">
    <div class="head">
        <label for="">
            0
        </label>
    </div>

    
</div>




<body>
     
        <div class="body">
        <button onclick="_clear()">
            C
        </button>

        <button onclick="addNumber(1)">
            1
        </button>

        <button onclick="addNumber(2)">
            2
        </button>

        <button onclick="setOperation('+')">
            +
        </button>

        <button onclick="setOperation('=')">
            =
        </button>
    </div>

</body>


<script>

    var valorUno = 0
    var valorDos = 0
    var operacion = ""

    function setOperation(_ope){
        ope = _ope

        let data = document.getElementById("calculadora_data")
        if (parseInt(data.innerHTML)> 0 && valorUno == 0){
            valorUno = parseInt(data.innerHTML)
            data.innerHTML = 0
        }


        if (parseInt(data.innerHTML) > 0 && valorDos == 0){
            valorUno = parseInt(data.innerHTML)
            data.innerHTML = 0
        }
        if (_ope == '='){
            data.innerHTML = valorUno + valorDos
            valorUno = 0
            valorDos = 0
        }

    }

    function _clear(){
        let data = document.getElementById("calculadora_data")
        data.innerHTML = "0"
    }


    function addNumber(value){
        console.log(value)

        let data = Document.getElementById("calculadora_data")
        console.log(data)

        if (parseInt(data.innerHtml) <= 0){
            data.innerHTML = value
        }else{
            data.innerHTML += value
        }
    }
</script>

</html>
