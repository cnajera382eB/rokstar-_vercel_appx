<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculadora">
    <input type="text" class="pantalla" readonly>

    <div class="botones">
        <button>C</button>
        <button>CE</button>
        <button>/</button>
        <button>*</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>-</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>

        <button class="igual">=</button>

        <button class="cero">0</button>
        <button>.</button>
    </div>
</div>

</body>
</html>
